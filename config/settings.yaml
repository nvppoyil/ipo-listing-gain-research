# All money values are INR unless noted.
app:
  name: IPO Listing-Gain Research
  timezone: Asia/Kolkata
  include_sme: false
  manual_trigger_only: true
  max_source_age_hours: 36
  request_timeout_seconds: 15
  user_agent: "IPOListingGainResearch/0.1 (research; contact: repository owner)"
capital:
  default_inr: 20000
  reserve_percent: 10
  lot_mode: AUTO_WHOLE_LOTS
risk:
  downside_scenarios_percent: [5, 10, 15, 20]
  highlighted_downside_percent: 20
  emphasize_loss_can_exceed_scenario: true
research:
  selected_ipo_required_for_modes: [SELECTED_IPO, LISTING_DAY_REVIEW]
  source_policy: "Public and permitted sources only; no login bypass, CAPTCHA bypass, or paywall circumvention."
  gmp_is_unofficial: true
  require_source_timestamp: true
report:
  formats: [markdown, json, csv]
  artifact_retention_days: 90
transaction_costs:
  # NSE's cited levy page was updated 2026-04-17. Exchange, brokerage and
  # DP entries below are configurable placeholders; verify your own tariff.
  # Percent units.
  stt_sell_percent: 0.10
  exchange_transaction_percent: 0.003
  sebi_turnover_percent: 0.0001
  gst_percent: 18.0
  brokerage_percent: 0.0
  brokerage_cap_inr: 20.0
  depository_charge_inr: 15.93
  source_url: https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies
