name: IPO Listing-Gain Research

on:
  workflow_dispatch:
    inputs:
      research_mode:
        description: What should be researched?
        required: true
        type: choice
        options:
          - ALL_MAINBOARD_IPOS
          - OPEN_IPOS
          - FINAL_DAY_REVIEW
          - SELECTED_IPO
          - LISTING_DAY_REVIEW
        default: ALL_MAINBOARD_IPOS
      selected_ipo:
        description: IPO name or symbol (needed for selected/listing-day modes)
        required: false
        type: string
      capital_inr:
        description: Available capital in Indian rupees
        required: true
        type: number
        default: 20000
      reserve_percent:
        description: Capital to keep in reserve (0, 10, or 20 percent)
        required: true
        type: choice
        options: ['0', '10', '20']
        default: '10'
      max_downside_percent:
        description: Downside scenario to highlight (not a maximum-loss guarantee)
        required: true
        type: choice
        options: ['5', '10', '15', '20']
        default: '20'
      lot_mode:
        description: Lot sizing rule
        required: true
        type: choice
        options:
          - AUTO_WHOLE_LOTS
          - ONE_LOT_MAX
        default: AUTO_WHOLE_LOTS

permissions:
  contents: read
  actions: read

concurrency:
  group: ipo-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    name: Run IPO research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate project
        run: python -m pytest -q
      - name: Run research pipeline
        env:
          RESEARCH_MODE: ${{ inputs.research_mode }}
          SELECTED_IPO: ${{ inputs.selected_ipo }}
          CAPITAL_INR: ${{ inputs.capital_inr }}
          RESERVE_PERCENT: ${{ inputs.reserve_percent }}
          MAX_DOWNSIDE_PERCENT: ${{ inputs.max_downside_percent }}
          LOT_MODE: ${{ inputs.lot_mode }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PYTHONPATH: .
        run: python -m src.main
      - name: Upload reports and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-research-${{ github.run_number }}
          path: |
            reports/
            data/snapshots/
          if-no-files-found: warn
          retention-days: 90
